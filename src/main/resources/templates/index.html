<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>

    <!-- Archivo CSS -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="contenedor">

    <!-- ===================== ENCABEZADO ===================== -->
    <header class="encabezado">
        <h1>📦 Sistema de Inventario de Producto</h1>
    </header>

    <!-- ===================== FORMULARIO DE REGISTRO / EDICIÓN ===================== -->
    <section class="tarjeta">
        <!--
            th:action="@{/productos/guardar}" apunta al método POST del controlador.
            th:object="${producto}" enlaza este formulario con el objeto "producto" del Model.
            Si "producto" trae id (venimos de "editar"), el título y botón cambian dinámicamente.
        -->
        <h2 th:text="${producto.id} != null ? '✏️ Editar producto' : '➕ Registrar nuevo producto'"></h2>

        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="formulario">

            <!-- Campo oculto: si estamos editando, aquí viaja el id del producto -->
            <input type="hidden" th:field="*{id}">

            <div class="fila-form">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Cuaderno 100 hojas">
                    <!-- Muestra el mensaje de error de validación si existe -->
                    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </div>

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" th:field="*{codigo}" placeholder="Ej: PRD-001">
                    <span class="error" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>
                </div>

                <div class="campo">
                    <label for="pasillo">Pasillo</label>
                    <input type="text" id="pasillo" th:field="*{pasillo}" placeholder="Ej: A-12">
                    <span class="error" th:if="${#fields.hasErrors('pasillo')}" th:errors="*{pasillo}"></span>
                </div>
            </div>

            <div class="fila-form">
                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" step="0.01" id="precio" th:field="*{precio}" placeholder="Ej: 2500">
                    <span class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
                </div>

                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" th:field="*{cantidad}" placeholder="Ej: 30">
                    <span class="error" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></span>
                </div>
            </div>

            <div class="acciones-form">
                <button type="submit" class="boton boton-primario">
                    <span th:text="${producto.id} != null ? 'Actualizar' : 'Guardar'"></span>
                </button>
                <!-- Botón para cancelar edición y limpiar el formulario -->
                <a th:href="@{/}" class="boton boton-secundario">Cancelar</a>
            </div>
        </form>
    </section>

    <!-- ===================== BUSCADOR ===================== -->
    <section class="tarjeta">
        <form th:action="@{/}" method="get" class="formulario-busqueda">
            <input type="text" name="buscar" th:value="${buscar}"
                   placeholder="🔍 Buscar por nombre o código...">
            <button type="submit" class="boton boton-primario">Buscar</button>
            <a th:href="@{/}" class="boton boton-secundario">Limpiar</a>
        </form>
    </section>

    <!-- ===================== TABLA DE PRODUCTOS ===================== -->
    <section class="tarjeta">
        <h2>📋 Productos registrados</h2>

        <table class="tabla">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Código</th>
                <th>Pasillo</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- th:each recorre la lista "productos" que envía el controlador -->
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.codigo}"></td>
                <td th:text="${p.pasillo}"></td>
                <td th:text="${'$' + #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${p.cantidad}"></td>
                <td class="celda-acciones">
                    <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="boton boton-editar">Editar</a>
                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
                       class="boton boton-eliminar"
                       onclick="return confirm('¿Seguro que deseas eliminar este producto?');">Eliminar</a>
                </td>
            </tr>

            <!-- Mensaje que se muestra si no hay productos -->
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="7" class="sin-datos">No hay productos registrados.</td>
            </tr>
            </tbody>
        </table>
    </section>

</div>

</body>
</html>
