<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->
    <header class="encabezado">
        <h1>📦 Sistema de Inventario de Productos</h1>
    </header>

    <!-- FORMULARIO -->
    <section class="tarjeta">

        <h2 th:text="${producto.id != null ? '✏️ Editar producto' : '➕ Registrar nuevo producto'}"></h2>

        <form th:action="@{/guardar}" th:object="${producto}" method="post" class="formulario">

            <input type="hidden" th:field="*{id}">

            <div class="fila-form">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ej: Arroz">

                    <span class="error"
                          th:if="${#fields.hasErrors('nombre')}"
                          th:errors="*{nombre}"></span>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <input type="text"
                           id="categoria"
                           th:field="*{categoria}"
                           placeholder="Ej: Abarrotes">

                    <span class="error"
                          th:if="${#fields.hasErrors('categoria')}"
                          th:errors="*{categoria}"></span>
                </div>

            </div>

            <div class="fila-form">

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number"
                           step="0.01"
                           id="precio"
                           th:field="*{precio}"
                           placeholder="Ej: 3500">

                    <span class="error"
                          th:if="${#fields.hasErrors('precio')}"
                          th:errors="*{precio}"></span>
                </div>

                <div class="campo">
                    <label for="stock">Stock</label>
                    <input type="number"
                           id="stock"
                           th:field="*{stock}"
                           placeholder="Ej: 20">

                    <span class="error"
                          th:if="${#fields.hasErrors('stock')}"
                          th:errors="*{stock}"></span>
                </div>

            </div>

            <div class="acciones-form">

                <button type="submit" class="boton boton-primario">
                    <span th:text="${producto.id != null ? 'Actualizar' : 'Guardar'}"></span>
                </button>

                <a th:href="@{/}" class="boton boton-secundario">
                    Cancelar
                </a>

            </div>

        </form>

    </section>

    <!-- BUSCADOR -->
    <section class="tarjeta">

        <form th:action="@{/}" method="get" class="formulario-busqueda">

            <input type="text"
                   name="buscar"
                   th:value="${buscar}"
                   placeholder="🔍 Buscar por nombre">

            <button type="submit" class="boton boton-primario">
                Buscar
            </button>

            <a th:href="@{/}" class="boton boton-secundario">
                Limpiar
            </a>

        </form>

    </section>

    <!-- TABLA -->
    <section class="tarjeta">

        <h2>📋 Productos registrados</h2>

        <table class="tabla">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="p : ${productos}">

                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.categoria}"></td>
                    <td th:text="${'$ ' + #numbers.formatDecimal(p.precio,1,'COMMA',2,'POINT')}"></td>
                    <td th:text="${p.stock}"></td>

                    <td class="celda-acciones">

                        <a th:href="@{/editar/{id}(id=${p.id})}"
                           class="boton boton-editar">
                            Editar
                        </a>

                        <a th:href="@{/eliminar/{id}(id=${p.id})}"
                           class="boton boton-eliminar"
                           onclick="return confirm('¿Desea eliminar este producto?')">
                            Eliminar
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(productos)}">

                    <td colspan="6" class="sin-datos">
                        No hay productos registrados.
                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</div>

</body>
</html>
